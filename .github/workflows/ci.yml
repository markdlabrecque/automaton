name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Push results must not satisfy the PR-only metadata gate.
    name: ${{ github.event_name == 'pull_request' && 'Repository checks' || 'Commit checks' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.20.0'
      - name: Check PR route and ticket references
        if: github.event_name == 'pull_request'
        run: node scripts/check-pr-policy.mjs
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Synthetic selective-recovery investigation (when present)
        shell: bash
        run: |
          if [[ -f investigations/selective-recovery/package-lock.json ]]; then
            cd investigations/selective-recovery
            npm ci --ignore-scripts --no-audit --no-fund
            npm run probe
          else
            echo 'Selective-recovery investigation is not on this branch; no application runtime tests exist yet.'
          fi
